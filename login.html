
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login | RB Tech Solution</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #071b2b;
      color: #172033;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 15px 45px #0004;
    }
    h1 { color: #075985; margin-top: 0; }
    p { color: #64748b; }
    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: 700;
    }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      border: 0;
      border-radius: 8px;
      background: #087f3c;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .link-btn {
      background: transparent;
      color: #075985;
      margin-top: 8px;
    }
    .message {
      margin-top: 15px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .back { text-align: center; margin-top: 20px; }
    .back a { color: #075985; }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>RB Tech Solution</h1>
    <p>Customer Account Login</p>

    <form id="customerLoginForm">
      <label for="email">Email Address</label>
      <input id="email" type="email" required autocomplete="username">

      <label for="password">Password</label>
      <input id="password" type="password" required autocomplete="current-password">

      <button id="loginBtn" type="submit">Login</button>
      <button id="resetBtn" class="link-btn" type="button">
        Forgot Password?
      </button>
    </form>

    <p id="loginMessage" class="message" aria-live="polite"></p>

    <div class="back">
      <a href="./index.html">Back to Website</a>
    </div>
  </main>

  <script type="module" src="./login.js"></script>
</body>
</html>
