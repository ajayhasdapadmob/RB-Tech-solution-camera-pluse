
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Customer Enquiry</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 15px;
      font-family: Arial, sans-serif;
      background: #f3f6f9;
      color: #172331;
    }

    .inquiry-container {
      max-width: 650px;
      margin: 30px auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand img {
      max-width: 130px;
      max-height: 90px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .brand h2 {
      margin: 5px 0;
      color: #075b9a;
    }

    .brand p {
      margin: 5px 0;
      color: #667085;
    }

    .form-heading {
      text-align: center;
      margin-bottom: 25px;
    }

    .form-heading h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .form-heading p {
      color: #667085;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 7px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d0d5dd;
      border-radius: 7px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #0879c9;
      box-shadow: 0 0 0 2px rgba(8,121,201,0.10);
    }

    .form-group textarea {
      min-height: 110px;
      resize: vertical;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #0879c9;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #075b9a;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .enquiry-status {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      font-size: 14px;
      line-height: 1.5;
    }

    .enquiry-status.success {
      display: block;
      background: #e8f7ed;
      color: #176b35;
    }

    .enquiry-status.error {
      display: block;
      background: #fdecec;
      color: #a52222;
    }

    .privacy-text {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: #667085;
    }

    .privacy-text a {
      color: #0879c9;
      text-decoration: none;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #0879c9;
      text-decoration: none;
    }

    @media(max-width: 600px) {
      .inquiry-container {
        padding: 22px 17px;
        margin: 10px auto;
      }

      .form-heading h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="inquiry-container">

    <!-- BUSINESS BRANDING -->

    <div class="brand">

      <img
        id="businessLogo"
        src=""
        alt="Business Logo"
      >

      <h2 id="businessName">RB Tech Solution</h2>

      <p id="businessTagline">
        CCTV & Security Systems
      </p>

    </div>

    <!-- FORM HEADING -->

    <div class="form-heading">

      <h1>Customer Enquiry</h1>

      <p>
        Please fill in the form below.
        Our team will contact you shortly.
      </p>

    </div>

    <!-- ENQUIRY FORM -->

    <form id="enquiryForm">

      <div class="form-group">

        <label for="enquiryName">
          Full Name *
        </label>

        <input
          type="text"
          id="enquiryName"
          placeholder="Enter your full name"
          required
          maxlength="100"
        >

      </div>

      <div class="form-group">

        <label for="enquiryCountry">
          Country *
        </label>

        <select id="enquiryCountry" required>

          <option value="India" selected>India (+91)</option>
          <option value="Bangladesh">Bangladesh (+880)</option>
          <option value="Nepal">Nepal (+977)</option>
          <option value="Bhutan">Bhutan (+975)</option>
          <option value="United States">United States (+1)</option>
          <option value="United Kingdom">United Kingdom (+44)</option>
          <option value="United Arab Emirates">UAE (+971)</option>
          <option value="Other">Other</option>

        </select>

      </div>

      <div class="form-group">

        <label for="enquiryPhone">
          Mobile Number *
        </label>

        <input
          type="tel"
          id="enquiryPhone"
          placeholder="Enter mobile number"
          required
          maxlength="20"
        >

      </div>

      <div class="form-group">

        <label for="enquiryEmail">
          Email Address
        </label>

        <input
          type="email"
          id="enquiryEmail"
          placeholder="Enter your email address"
          maxlength="150"
        >

      </div>

      <div class="form-group">

        <label for="enquiryProductName">
          Product / Service
        </label>

        <input
          type="text"
          id="enquiryProductName"
          name="productName"
          placeholder="Product or service name"
          maxlength="200"
        >

        <input
          type="hidden"
          id="enquiryProductId"
          name="productId"
        >

      </div>

      <div class="form-group">

        <label for="enquiryMessage">
          Your Message
        </label>

        <textarea
          id="enquiryMessage"
          placeholder="Write your enquiry here..."
          maxlength="2000"
        ></textarea>

      </div>

      <button
        type="submit"
        id="submitEnquiryBtn"
        class="submit-btn"
      >
        Submit Enquiry
      </button>

      <div
        id="enquiryStatus"
        class="enquiry-status"
        role="status"
        aria-live="polite"
      ></div>

    </form>

    <!-- PRIVACY POLICY -->

    <div class="privacy-text">

      By submitting this form, you agree to our

      <a
        id="privacyPolicyLink"
        href="privacy-policy.html"
        target="_blank"
      >
        Privacy Policy
      </a>

    </div>

    <!-- BACK LINK -->

    <a href="index.html" class="back-link">
      ← Back to Website
    </a>

    <p style="text-align:center;font-size:12px;color:#98a2b3;margin-top:25px;">
      © 2026 <span id="footerBusinessName">RB Tech Solution</span>
    </p>

  </main>

  <!-- CUSTOMER WEBSITE JAVASCRIPT -->

  <script type="module" src="./customer-website.js"></script>

</body>
</html>
